<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2020 Games Hub 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f4f5;--panel:#fff;--text:#1b1d21;--sub:#6b7280;--accent:#00a2ff;--line:#e3e6ea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--panel:#232529;--text:#f1f2f4;--sub:#9aa0aa;--line:#34373d}}
:root[data-theme="dark"]{--bg:#17181c;--panel:#232529;--text:#f1f2f4;--sub:#9aa0aa;--line:#34373d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px}
header h1{font-size:20px;margin:0}header input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:120px;font:inherit;font-size:13px}header span{color:var(--sub);font-size:13px}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{font-size:18px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s;text-align:left;padding:0;color:inherit;font:inherit}
.card:hover{transform:translateY(-3px)}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}
.badge{position:absolute;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 7px}
.info{padding:10px 12px}.info b{display:block;font-size:14px}
.meta{color:var(--sub);font-size:12px;margin-top:4px}
.locked{opacity:.55;cursor:not-allowed}.locked:hover{transform:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:20;padding:0}
#modal.on{display:flex}
.win{background:var(--panel);width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.bar button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
#view{position:relative;background:#000;line-height:0;flex:1;min-height:0}
#view canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.55);color:#fff;font:700 28px/1.4 system-ui;pointer-events:none;white-space:pre-line}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;background:rgba(0,0,0,.6);color:#fff;padding:6px 16px;border-radius:10px;font:600 16px/1.3 system-ui;pointer-events:none;text-align:center;white-space:pre-line;max-width:92%}#petview{padding:20px;text-align:center;flex:1;overflow:auto}#emb{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;line-height:1.2}#emp{position:absolute;left:10px;bottom:50px;display:none;flex-direction:column;gap:4px}#emp button{background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:6px;padding:6px 12px;text-align:left;cursor:pointer;line-height:1.2}#clog{position:absolute;left:10px;top:10px;max-width:45%;color:#fff;font:13px/1.4 system-ui;text-shadow:0 1px 3px #000;pointer-events:none}#chatin{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(320px,50%);padding:8px 12px;border-radius:8px;border:0;background:rgba(0,0,0,.6);color:#fff;font:14px system-ui}#lobby{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,18,.88);z-index:6;line-height:1.4}#lobby .lbx{background:var(--panel);color:var(--text);border-radius:12px;padding:20px 26px;min-width:min(360px,90%);text-align:center}#lbl{margin:12px 0;font-size:14px}#hp{position:absolute;top:12px;right:12px;width:min(220px,40%);height:20px;background:rgba(0,0,0,.55);border-radius:10px;overflow:hidden;display:none;border:2px solid rgba(255,255,255,.6)}#hpf{height:100%;width:100%;transition:width .15s}#hpt{position:absolute;inset:0;text-align:center;color:#fff;font:700 13px/20px system-ui;text-shadow:0 1px 2px #000}#hurt{position:absolute;inset:0;pointer-events:none;background:radial-gradient(transparent 40%,rgba(255,0,0,.6));opacity:0}
#egg{font-size:90px;background:none;border:0;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;margin:4px}
.btn:disabled{opacity:.4;cursor:not-allowed}
#pets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.pet{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.hint{padding:8px 14px;font-size:12px;color:var(--sub)}#custom{display:none;padding:10px 14px;max-height:45vh;overflow:auto}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.row b{width:64px;font-size:13px;text-transform:capitalize}.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:5px 10px;font-size:12px;cursor:pointer}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.touch{display:none;gap:6px;padding:8px 14px;flex-wrap:wrap}
.touch button{flex:1;min-width:48px;padding:12px;font-size:16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);touch-action:none}
@media (pointer:coarse){.touch.on{display:flex}}
body{background:radial-gradient(1100px 600px at 8% -10%,rgba(0,162,255,.2),transparent),radial-gradient(900px 500px at 100% 0,rgba(126,87,194,.2),transparent),var(--bg)}
header{position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--panel) 82%,transparent);flex-wrap:wrap}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#00a2ff,#7e57c2);color:#fff;border-radius:18px;padding:24px 28px;margin-bottom:24px;box-shadow:0 12px 32px rgba(0,100,255,.28)}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;opacity:.92}
.card{border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(0,0,0,.28)}
.thumb{height:130px;font-size:58px}.info b{font-size:15px}
footer{text-align:center;color:var(--sub);font-size:12px;padding:24px}
#spec{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:rgba(0,0,0,.65);color:#fff;padding:8px 12px;border-radius:10px;line-height:1.2}#spec button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600}#lockmsg{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);display:none;background:rgba(0,0,0,.72);color:#fff;padding:10px 18px;border-radius:10px;font:600 15px system-ui;pointer-events:none;white-space:pre-line;text-align:center}#hm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font:900 26px system-ui;opacity:0;pointer-events:none;text-shadow:0 0 4px #000}#xh{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 4px #000;display:none;pointer-events:none}#vote{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:6px;background:rgba(0,0,0,.62);color:#fff;padding:10px;border-radius:12px;width:min(230px,45%);line-height:1.3;max-height:80%;overflow:auto}
#vote b{font-size:14px}#vote button{display:flex;justify-content:space-between;background:rgba(255,255,255,.12);color:#fff;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}#vote button.on{background:var(--accent);border-color:#fff}#vote small{font-size:11px;opacity:.85}
#role{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);display:none;background:rgba(0,0,0,.66);color:#fff;padding:8px 14px;border-radius:10px;font:600 14px system-ui;line-height:1.4;min-width:220px;text-align:center}#rcd{display:block;height:5px;background:#fff;border-radius:3px;margin-top:5px;width:100%}
#rev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;font:900 64px/1.2 system-ui;text-shadow:0 4px 20px #000;text-align:center}#rev small{font:600 20px system-ui;color:#fff;display:block;margin-top:8px}#rev.on{animation:rv 3.2s forwards}
@keyframes rv{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#frp{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);background:var(--panel);color:var(--text);border-left:1px solid var(--line);z-index:50;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column;padding:14px;gap:12px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.3)}#frp.on{transform:none}
#frp .frh{display:flex;justify-content:space-between;align-items:center;font-size:17px}
#frp button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600}
#frp input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.frc,.fra{display:flex;gap:6px;align-items:center;margin-top:4px}.frc code{flex:1;background:var(--bg);padding:7px 10px;border-radius:8px;letter-spacing:2px}
.frr{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px}.frr .dot{width:10px;height:10px;border-radius:50%;background:#888;flex:none}.frr.on .dot{background:#3ddc84}.frr .nm{flex:1;min-width:0}.frr small{display:block;color:var(--sub)}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#222;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);font:14px system-ui}.toast button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
#app{display:flex;min-height:100vh}
#side{width:224px;flex:none;position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:16px}
.logo{font-size:22px;font-weight:800;display:flex;gap:10px;align-items:center;padding:4px 10px}.logo span{background:linear-gradient(90deg,#00a2ff,#a46bff);-webkit-background-clip:text;background-clip:text;color:transparent}
#side nav{display:flex;flex-direction:column;gap:4px}
#side nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:var(--text);padding:11px 12px;border-radius:12px;font:600 15px system-ui;cursor:pointer;text-align:left;transition:background .15s}
#side nav button:hover{background:var(--bg)}#side nav button.on{background:linear-gradient(90deg,rgba(0,162,255,.22),rgba(164,107,255,.16));color:var(--accent)}
.sfoot{margin-top:auto;color:var(--sub);font-size:11px;padding:0 10px;line-height:1.5}
#mainp{flex:1;min-width:0;padding:20px 26px 48px;max-width:1240px;margin:0 auto;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px;flex:1;min-width:190px;max-width:380px}.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:15px system-ui;outline:0}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.who label{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}.who label input{width:104px;background:none;border:0;color:var(--text);font:14px system-ui;outline:0}
.chipb{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font:600 14px system-ui;cursor:pointer}.chipb.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
#online{font-size:13px;color:var(--sub)}
#hero{position:relative;border-radius:24px;overflow:hidden;min-height:270px;display:flex;align-items:flex-end;padding:30px;color:#fff;margin-bottom:8px;box-shadow:0 18px 50px rgba(0,0,0,.28);transition:background .5s}
#hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 70%);pointer-events:none}
#hero>div{position:relative;z-index:2}#hero .big{position:absolute;right:36px;top:14px;font-size:160px;line-height:1;filter:drop-shadow(0 12px 26px rgba(0,0,0,.45));z-index:1;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(3deg)}}
#hero h1{margin:0 0 6px;font-size:36px}#hero p{margin:0 0 18px;max-width:540px;opacity:.95;font-size:16px;line-height:1.45}
.hbtn{background:#fff;color:#111;border:0;border-radius:12px;padding:12px 24px;font:700 15px system-ui;cursor:pointer}.hbtn.alt{background:rgba(255,255,255,.22);color:#fff;margin-left:8px}
.dots{position:absolute!important;bottom:16px;right:22px;display:flex;gap:7px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}.dots i.on{background:#fff;width:22px;border-radius:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}.chips button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:7px 15px;font:600 14px system-ui;cursor:pointer}.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sec{margin:22px 0 12px;font-size:19px;font-weight:800}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;position:relative;transition:transform .18s,box-shadow .18s;outline:0}
.gc:hover,.gc:focus-visible{transform:translateY(-6px);box-shadow:0 18px 36px rgba(0,0,0,.28)}
.gc .art{height:132px;position:relative;display:flex;align-items:center;justify-content:center;font-size:66px;overflow:hidden}.gc .art::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 0,rgba(255,255,255,.4),transparent 55%)}
.gc .fav{position:absolute;top:9px;right:9px;z-index:2;background:rgba(0,0,0,.4);border:0;color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
.gc .nw{position:absolute;top:10px;left:10px;z-index:2;background:#ff3b6b;color:#fff;font:800 11px system-ui;border-radius:8px;padding:3px 8px}
.gc .bd{padding:13px 15px}.gc b{display:block;font-size:16px}.gc .mt{color:var(--sub);font-size:12px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
#gd{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:25;display:none;align-items:center;justify-content:center;padding:14px}#gd.on{display:flex}
.gdb{background:var(--panel);color:var(--text);border-radius:24px;overflow:hidden;width:min(560px,100%);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .2s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.gda{height:190px;display:flex;align-items:center;justify-content:center;font-size:100px;position:relative}.gdx{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.4);color:#fff;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer}
.gdc{padding:20px 24px 24px}.gdc h2{margin:0 0 10px;font-size:26px}.gdt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.gdt span{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:12px;color:var(--sub)}
.gdc p{line-height:1.55;color:var(--text);margin:0 0 18px}.gdr{display:flex;gap:8px;flex-wrap:wrap}.gdr .pri{background:var(--accent);color:#fff;flex:1}.gdr .alt2{background:var(--bg);color:var(--text);border:1px solid var(--line)}
#sp{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);background:var(--panel);color:var(--text);border-left:1px solid var(--line);z-index:50;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column;padding:14px;gap:14px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.3)}#sp.on{transform:none}
#sp .frh{display:flex;justify-content:space-between;align-items:center;font-size:17px}#sp button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}#sp .dng{background:#c62828}
.set{display:flex;flex-direction:column;gap:6px;font-size:14px}.set select,.set input[type=range]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px}
@media(max-width:860px){#side{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);z-index:15}.logo,.sfoot{display:none}#side nav{flex-direction:row;width:100%;justify-content:space-around}#side nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;align-items:center}#mainp{padding:14px 14px 90px}#hero{min-height:230px;padding:20px}#hero .big{font-size:96px;right:14px}#hero h1{font-size:26px}}
</style>
</head>
<body>
<div id="app">
<aside id="side"><div class="logo">🎮<span>Games Hub</span></div>
<nav><button data-nav="home" class="on">🏠<span>Home</span></button><button data-nav="games">🕹️<span>Games</span></button><button data-nav="avatar">🧢<span>Avatar</span></button><button data-nav="friends">👥<span>Friends</span></button><button data-nav="settings">⚙️<span>Settings</span></button></nav>
<div class="sfoot">Made with Three.js · Multiplayer by Supabase · Not affiliated with Roblox</div></aside>
<section id="mainp">
<div class="top"><div class="search">🔎<input id="q" placeholder="Search games..." autocomplete="off"></div>
<div class="who"><label title="Your name">👤<input id="nick" placeholder="Your name" maxlength="14"></label><label title="Room code: friends with the same code play together">🔑<input id="roomcode" placeholder="Room" maxlength="20" value="public"></label><span id="online"></span><button id="inv" class="chipb">🔗 Invite link</button><button id="frb" class="chipb pri">👥 Friends</button></div></div>
<div id="hero"></div><div id="rows"></div>
</section></div>
<div id="gd"></div>
<div id="sp"><div class="frh"><b>⚙️ Settings</b><button id="spx2">✕</button></div>
<label class="set"><span>Mouse sensitivity <b id="sensv"></b></span><input type="range" id="sens" min="1" max="10"></label>
<label class="set"><span>Graphics</span><select id="qual"><option value="auto">Auto</option><option value="low">Low (faster)</option><option value="high">High (sharper)</option></select></label>
<label class="set"><span>Theme</span><select id="thm"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label class="set"><span>Sound</span><button id="snb">🔊 On</button></label>
<button id="rst" class="dng">Reset all saved data</button></div>

<div id="frp"><div class="frh"><b>👥 Friends</b><button id="frx">✕</button></div>
<div>Your friend code<div class="frc"><code id="myc"></code><button id="cpc">Copy link</button></div></div>
<div class="fra"><input id="addc" placeholder="Add a friend by code" maxlength="8"><button id="addb">Add</button></div>
<div id="frl"></div><small id="frn" style="color:var(--sub)"></small></div><div id="toasts"></div>
<div id="modal"><div class="win">
<div class="bar"><b id="gtitle"></b><span id="score"></span><span><button id="frb2">👥</button> <button id="mt">🔊</button> <button id="fs">⛶</button> <button id="close">Exit</button></span></div>
